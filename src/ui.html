<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h2 { font-size: 15px; font-weight: 600; color: #111; }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-weight: 500;
      color: #444;
    }

    .labelRow {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: #0d99ff; }

    .optionalSection {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .optionalTitle {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .uploadRow {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .uploadLabel {
      font-weight: 500;
      color: #555;
      min-width: 90px;
    }

    .uploadButton {
      padding: 5px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .uploadButton:hover { background: #eaeaea; }

    .uploadFilename {
      font-size: 11px;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .uploadFilename.loaded { color: #1a7f37; }

    input[type="file"] { display: none; }

    .generateButton {
      width: 100%;
      padding: 10px;
      background: #0d99ff;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .generateButton:hover { background: #0b87e0; }
    .generateButton:disabled { background: #a0cfff; cursor: not-allowed; }

    .statusMessage {
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }
    .statusMessage.success { color: #1a7f37; }
    .statusMessage.error   { color: #cf2222; }

    .hint { font-size: 11px; color: #aaa; font-weight: 400; }
  </style>
</head>
<body>
  <h2>Template Generator</h2>

  <label>
    <div class="labelRow">
      Texts <span class="hint">— one per line, use ; for a line break</span>
    </div>
    <textarea id="textsInput" placeholder="What Is Paysafecard&#10;Is Gambling Legal in NZ?&#10;How to Choose a;Paysafecard Casino"></textarea>
  </label>

  <div class="optionalSection">
    <span class="optionalTitle">Optional overrides</span>

    <div class="uploadRow">
      <span class="uploadLabel">Logo</span>
      <button class="uploadButton" onclick="document.getElementById('logoFile').click()">Choose file</button>
      <span class="uploadFilename" id="logoName">uses template</span>
    </div>
    <input type="file" id="logoFile" accept="image/png,image/svg+xml,image/jpeg" />

    <div class="uploadRow">
      <span class="uploadLabel">Center image</span>
      <button class="uploadButton" onclick="document.getElementById('centerFile').click()">Choose file</button>
      <span class="uploadFilename" id="centerName">uses template</span>
    </div>
    <input type="file" id="centerFile" accept="image/png,image/svg+xml,image/jpeg" />
  </div>

  <button class="generateButton" id="generateBtn" onclick="generate()">Generate</button>

  <p class="statusMessage" id="status"></p>

  <script>
    let logoBytes = null;
    let centerBytes = null;

    document.getElementById('logoFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      logoBytes = new Uint8Array(await file.arrayBuffer());
      const el = document.getElementById('logoName');
      el.textContent = file.name;
      el.className = 'uploadFilename loaded';
    });

    document.getElementById('centerFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      centerBytes = new Uint8Array(await file.arrayBuffer());
      const el = document.getElementById('centerName');
      el.textContent = file.name;
      el.className = 'uploadFilename loaded';
    });

    function generate() {
      const rawTexts = document.getElementById('textsInput').value;
      const texts = rawTexts.split('\n').map(t => t.trim()).filter(Boolean);

      if (texts.length === 0) {
        showStatus('Add at least one text.', 'error');
        return;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      showStatus('', '');

      parent.postMessage({
        pluginMessage: {
          type: 'generate',
          texts,
          logoBytes: logoBytes || undefined,
          centerBytes: centerBytes || undefined,
        }
      }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      const btn = document.getElementById('generateBtn');
      btn.disabled = false;
      btn.textContent = 'Generate';

      if (msg.type === 'done') {
        showStatus(`Done! Created ${msg.count} frame${msg.count > 1 ? 's' : ''}.`, 'success');
      } else if (msg.type === 'error') {
        showStatus(msg.message, 'error');
      }
    };

    function showStatus(text, type) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'statusMessage ' + type;
    }
  </script>
</body>
</html>
